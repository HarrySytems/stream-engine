<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b8ff" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#07070c" />
  <rect x="64" y="64" width="384" height="384" rx="96" fill="url(#cyan-gradient)" filter="url(#neon-glow)" />
  <text x="256" y="325" fill="#07070c" font-size="200" font-weight="900" font-family="'Outfit', 'Inter', sans-serif" text-anchor="middle" letter-spacing="-5">
    TV
  </text>
</svg>
